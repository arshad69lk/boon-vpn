name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project
        run: |
          # If files were uploaded inside a subfolder, move them to root
          if [ -d "boon_vpn_project" ]; then
            cp -r boon_vpn_project/* .
          fi
          flutter create . --org com.boonvpn
          flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boon-vpn-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
